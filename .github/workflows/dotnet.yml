# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Verify the native FFI binaries
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        pinned=$(git ls-tree HEAD LivekitRtc/rust-sdks | awk '{print $3}')
        refs=$(git ls-remote --tags https://github.com/livekit/rust-sdks 'livekit-ffi/*')
        tag=$(awk -v sha="$pinned" '$1 == sha {sub("refs/tags/", "", $2); sub(/\^\{\}$/, "", $2); print $2}' <<<"$refs" | sort -V | tail -1)
        if [ -z "$tag" ]; then
          echo "::error::LivekitRtc/rust-sdks points to $pinned, which is not a livekit-ffi release tag"
          exit 1
        fi
        LivekitRtc/download_ffi.sh "$tag"
        if [ -n "$(git status --porcelain -- LivekitRtc/runtimes)" ]; then
          git status --short -- LivekitRtc/runtimes
          echo "::error::The binaries in LivekitRtc/runtimes are not the ones published for $tag"
          exit 1
        fi
    - name: Setup .NET
      uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    - name: Test
      run: dotnet test --no-build --verbosity normal
    - name: Pack
      run: dotnet pack -c Debug -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg
    - name: Build API reference
      run: |
        dotnet tool restore
        dotnet docfx docs/docfx.json --warningsAsErrors
        python3 docs/check_api_docs.py
