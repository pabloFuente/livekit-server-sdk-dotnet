# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

permissions:
  contents: read

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Verify the native FFI binaries
      env:
        GH_TOKEN: ${{ github.token }}
      run: LivekitRtc/download_ffi.sh --verify
    - name: Setup .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore
    - name: Build
      run: dotnet build --no-restore
    # Every test, with coverage: the report goes to the job summary and to the coverage-report
    # artifact, and the step fails below the minimums of coverage/thresholds.json
    - name: Test with coverage
      run: ./coverage.sh --no-build --verbosity normal
    - name: Upload the coverage report
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: coverage-report
        path: coverage/report
        if-no-files-found: ignore
    - name: Pack
      run: dotnet pack -c Debug -p:IncludeSymbols=true -p:SymbolPackageFormat=snupkg
    - name: Build API reference
      run: |
        dotnet tool restore
        dotnet docfx docs/docfx.json --warningsAsErrors
        python3 docs/check_api_docs.py
    # Known vulnerabilities in the NuGet packages of every project (direct and transitive), in the
    # .NET tools and in the pinned actions, judged by security/policy.json (security.yml adds the
    # native crates). These steps run even after a failed step, so neither hides the other
    - name: Scan dependencies for vulnerabilities
      if: ${{ !cancelled() }}
      env:
        GH_TOKEN: ${{ github.token }}
      run: python3 security/check_vulnerabilities.py
    # The scan above is the gate. Dependency review only sees GitHub's dependency graph, whose NuGet
    # versions come from automatic dependency submission (a repository setting) and which matches
    # no advisories for actions pinned by SHA; it applies the same severity threshold and exceptions
    - name: Read the dependency review policy
      id: review-policy
      if: ${{ !cancelled() && github.event_name == 'pull_request' }}
      run: python3 security/check_vulnerabilities.py --dependency-review-outputs
    - name: Dependency review
      if: ${{ !cancelled() && steps.review-policy.outcome == 'success' }}
      uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
      with:
        fail-on-severity: ${{ steps.review-policy.outputs.fail-on-severity }}
        allow-ghsas: ${{ steps.review-policy.outputs.allow-ghsas }}
        show-patched-versions: true

  # The build job runs every RTC test on linux-x64. The next two jobs cover the other five native
  # binaries that Livekit.Rtc.Dotnet ships, each on its own platform.

  # linux-arm64: every RTC test
  rtc-linux-arm64:
    name: RTC tests (linux-arm64)
    runs-on: ubuntu-24.04-arm
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: 10.0.x
    - name: Test
      run: dotnet test LivekitRtc.Tests

  # Windows and macOS can't start the Linux containers of the e2e tests
  # Run only the tests that load the native library without Docker
  rtc-native:
    name: RTC native tests (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, runner: windows-latest }
          - { rid: win-arm64, runner: windows-11-arm }
          - { rid: osx-x64, runner: macos-15-intel }
          - { rid: osx-arm64, runner: macos-latest }
    runs-on: ${{ matrix.runner }}
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: 10.0.x
    - name: Test
      run: dotnet test LivekitRtc.Tests --filter "FullyQualifiedName~FfiClientTest|FullyQualifiedName~AudioCaptureMinimalTest|FullyQualifiedName~AudioSourcePlayoutTests|FullyQualifiedName~AudioResamplerTests|FullyQualifiedName~EncodedVideoSourceTests|FullyQualifiedName~VideoFramePinningTests|FullyQualifiedName~VideoFramePlanesTests"
