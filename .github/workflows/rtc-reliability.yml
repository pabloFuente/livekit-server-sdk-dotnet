# Extended reliability tier of Livekit.Rtc.Dotnet: the long stress loops, the server outages and the
# soak of LivekitRtc.Tests/Reliability (see its README.md). Pull requests run the same tests at the
# short default level as part of every RTC test run; this workflow scales them up every night, on
# the six platforms the package ships native binaries for. Not a required check.

name: RTC reliability

permissions:
  contents: read

on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
    inputs:
      soak-minutes:
        description: Duration of the mixed-workload soak, in minutes
        default: "10"

env:
  DOTNET_NOLOGO: true
  LIVEKIT_STRESS: extended

jobs:
  # Every reliability test, including the ones that need a LiveKit server in Docker
  linux:
    name: Extended reliability (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: linux-x64, runner: ubuntu-latest }
          - { rid: linux-arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      LIVEKIT_SOAK_MINUTES: ${{ inputs.soak-minutes || '10' }}
      LIVEKIT_TEST_STDERR_FILE: ${{ github.workspace }}/TestResults/sdk-stderr.log
      # A crash of the native library kills the test host: keep the runtime's crash report (managed
      # and native stacks) and a minidump with the results, for a report upstream
      DOTNET_DbgEnableMiniDump: 1
      DOTNET_DbgMiniDumpType: 1
      DOTNET_EnableCrashReport: 1
      DOTNET_DbgMiniDumpName: ${{ github.workspace }}/TestResults/crash-%p.dmp
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: 10.0.x
    # The soak runs in a test process of its own, after the other tests and even if they failed: a
    # native crash during its heavy churn (see the README's known limitations) would otherwise
    # abort the whole run and hide every other result
    - name: Test
      run: |
        mkdir -p TestResults
        dotnet test LivekitRtc.Tests -c Release --filter "Category=Reliability&FullyQualifiedName!~SoakTests" \
          --logger "trx;LogFileName=reliability.trx" --logger "console;verbosity=normal" \
          --results-directory TestResults
    # A soak that hangs fails on its own after LIVEKIT_SOAK_MINUTES + 5 minutes, naming the last
    # operations of its workers. --blame-hang only acts about a minute later, when the process is too
    # stuck to fail: it then keeps a minidump of every thread's stack with the results
    - name: Soak
      if: ${{ !cancelled() }}
      run: |
        dotnet test LivekitRtc.Tests -c Release --filter "FullyQualifiedName~SoakTests" \
          --logger "trx;LogFileName=soak.trx" --logger "console;verbosity=normal" \
          --blame-hang --blame-hang-dump-type mini \
          --blame-hang-timeout "$(( ${LIVEKIT_SOAK_MINUTES%.*} + 6 ))m" \
          --results-directory TestResults
    # The SDK reports what it drops on stderr ([WARN] RoomEvent..., [ERROR]...), which dotnet test
    # does not show: keep it with the results, and the crash reports if any
    - name: Upload the results
      if: ${{ !cancelled() }}
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: reliability-${{ matrix.rid }}
        path: TestResults
        if-no-files-found: ignore

  # Hosted Windows and macOS runners cannot start the Linux containers: the native tier only
  native:
    name: Extended native reliability (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { rid: win-x64, runner: windows-latest }
          - { rid: win-arm64, runner: windows-11-arm }
          - { rid: osx-x64, runner: macos-15-intel }
          - { rid: osx-arm64, runner: macos-latest }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Setup .NET
      uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
      with:
        dotnet-version: 10.0.x
    - name: Test
      run: dotnet test LivekitRtc.Tests -c Release --filter "FullyQualifiedName~Reliability.Native" --logger "console;verbosity=normal"
