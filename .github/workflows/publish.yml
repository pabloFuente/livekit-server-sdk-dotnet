# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: publish
permissions:
  contents: read
on:
  workflow_dispatch: # Allow running the workflow manually from the GitHub UI
  release:
    types:
      - published # Run the workflow when a new GitHub release is published

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
  DOTNET_NOLOGO: true
  NuGetDirectory: ${{ github.workspace}}/nuget

defaults:
  run:
    shell: bash

jobs:
  create_nuget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Get all history to allow automatic versioning using MinVer
          submodules: recursive # Required for LivekitRtc which depends on rust-sdks submodule

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      # Determine which project to pack based on release tag
      - name: Determine project to pack
        id: determine_project
        run: |
          TAG="${{ github.event.release.tag_name }}"
          if [[ "$TAG" == api-* ]]; then
            echo "project=LivekitApi/LivekitApi.csproj" >> "$GITHUB_OUTPUT"
            echo "project_name=LivekitApi" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG" == rtc-* ]]; then
            echo "project=LivekitRtc/LivekitRtc.csproj" >> "$GITHUB_OUTPUT"
            echo "project_name=LivekitRtc" >> "$GITHUB_OUTPUT"
          else
            echo "Invalid tag format. Expected 'api-X.Y.Z' or 'rtc-X.Y.Z', got '$TAG'" >&2
            exit 1
          fi

      # The binaries about to be packed must be the ones upstream published for the pinned
      # rust-sdks tag, even for a commit that reached main without a pull request
      - name: Verify the native FFI binaries
        if: steps.determine_project.outputs.project_name == 'LivekitRtc'
        env:
          GH_TOKEN: ${{ github.token }}
        run: LivekitRtc/download_ffi.sh --verify

      # Create the NuGet package for the specific project
      - name: Pack NuGet package
        run: dotnet pack ${{ steps.determine_project.outputs.project }} -c Release --output ${{ env.NuGetDirectory }}

      # Publish the NuGet package as an artifact, so they can be used in the following jobs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget
          if-no-files-found: error
          retention-days: 7
          path: ${{ env.NuGetDirectory }}/*.nupkg

  validate_nuget:
    runs-on: ubuntu-latest
    needs: [create_nuget]
    steps:
      # Only for .config/dotnet-tools.json, which pins the validator. It runs before the download
      # because checking out into a non-empty workspace would clear it
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      # Download the NuGet package created in the previous job
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget
          path: ${{ env.NuGetDirectory }}

      - name: Install nuget validator
        run: dotnet tool restore

      # Validate metadata and content of the NuGet package
      # https://www.nuget.org/packages/Meziantou.Framework.NuGetPackageValidation.Tool#readme-body-tab
      # If some rules are not applicable, you can disable them
      # using the --excluded-rules or --excluded-rule-ids option
      - name: Validate package
        run: dotnet meziantou.validate-nuget-package --excluded-rules IconMustBeSet "${{ env.NuGetDirectory }}"/*.nupkg

  run_test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive # Required for LivekitRtc which depends on rust-sdks submodule
      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x
      - name: Run tests
        run: dotnet test -c Release

  deploy:
    permissions:
      contents: write
      pull-requests: write # The post-release pull request
      id-token: write # NuGet Trusted Publishing
    # Publish only when creating a GitHub Release
    # https://docs.github.com/en/repositories/releasing-projects-on-github/managing-releases-in-a-repository
    # You can update this logic if you want to manage releases differently
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs: [validate_nuget, run_test]
    steps:
      # Download the NuGet package created in the previous job
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget
          path: ${{ env.NuGetDirectory }}

      - name: Setup .NET Core
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      # NuGet Trusted Publishing: exchange this workflow's OIDC token for a short-lived API key
      - name: Log in to NuGet (Trusted Publishing)
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        with:
          user: ${{ secrets.NUGET_USER }}

      # Publish all NuGet packages to NuGet.org
      # Use --skip-duplicate to prevent errors if a package with the same version already exists.
      # If you retry a failed workflow, already published packages will be skipped without error.
      - name: Publish NuGet package
        run: |
          for file in "${{ env.NuGetDirectory }}"/*.nupkg; do
            dotnet nuget push "$file" --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" --source https://api.nuget.org/v3/index.json --skip-duplicate
          done

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Post release steps
        run: |
          TAG="${{ github.event.release.tag_name }}"

          # Determine which package to update based on tag prefix
          # Expected tag formats: api-X.Y.Z or rtc-X.Y.Z
          if [[ "$TAG" == api-* ]]; then
            # API package release
            VERSION="${TAG#api-}"
            echo "Updating LivekitApi to version $VERSION"
            sed -i "s|<PackageValidationBaselineVersion>.*</PackageValidationBaselineVersion>|<PackageValidationBaselineVersion>$VERSION</PackageValidationBaselineVersion>|" LivekitApi/LivekitApi.csproj
            rm -f LivekitApi/CompatibilitySuppressions.xml
          elif [[ "$TAG" == rtc-* ]]; then
            # RTC package release
            VERSION="${TAG#rtc-}"
            echo "Updating LivekitRtc to version $VERSION"
            sed -i "s|<PackageValidationBaselineVersion>.*</PackageValidationBaselineVersion>|<PackageValidationBaselineVersion>$VERSION</PackageValidationBaselineVersion>|" LivekitRtc/LivekitRtc.csproj
            rm -f LivekitRtc/CompatibilitySuppressions.xml
          else
            echo "Invalid tag format. Expected 'api-X.Y.Z' or 'rtc-X.Y.Z'" >&2
            exit 1
          fi

      # The ruleset on main only lets workflows change it through a pull request that passes `build`
      - name: Open the post-release pull request
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |
          git diff --quiet && exit 0 # nothing to move: the baseline already is this version
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "post-release/$TAG"
          git commit -qam "Post steps release $TAG"
          git push origin "post-release/$TAG"
          gh pr create --head "post-release/$TAG" --title "Post steps release $TAG" --body "Moves the package validation baseline to $TAG, which is now on NuGet. Merge it before the next release of the same package. If \`build\` cannot download the baseline, NuGet has not listed the package yet: re-run it a few minutes later."
